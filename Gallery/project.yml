name: SwiftKitUIGallery

options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SwiftKitUI:
    # The gallery consumes the kit exactly the way a customer does — as a
    # package dependency, not by reaching into the source folder. If the public
    # API is awkward, building this app is where we find out first.
    path: ..

targets:
  SwiftKitUIGallery:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: SwiftKitUI
        product: SwiftKitUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theswiftkit.ui.gallery
        PRODUCT_NAME: Swift Kit UI
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Swift Kit UI
        SWIFT_VERSION: '6.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        ENABLE_PREVIEWS: 'YES'
        SWIFT_EMIT_LOC_STRINGS: 'YES'

  SwiftKitUIGalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SwiftKitUIGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theswiftkit.ui.gallery.uitests
        SWIFT_VERSION: '6.0'
        TEST_TARGET_NAME: SwiftKitUIGallery
        GENERATE_INFOPLIST_FILE: 'YES'

schemes:
  SwiftKitUIGallery:
    build:
      targets:
        SwiftKitUIGallery: all
        SwiftKitUIGalleryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftKitUIGalleryUITests
